
name: Docker Image CI - Depot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and Push to Depot
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Depot
        uses: depot/setup-action@v1

      - name: Build and Push Docker Image
        uses: depot/build-push-action@v1
        with:
          project: h8kgdxmq4g
          context: .
          save: true
          save-tags: |
            latest
            ${{ github.sha }}
